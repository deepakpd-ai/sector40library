<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Sector 40 Library</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1a1a2e; --paper:#f7f4ef; --gold:#b5860d; --muted:#7a7068; --green:#1a7c3e; --red:#c0392b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; }

  header { background:var(--ink); padding:24px 40px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .header-left h1 { font-family:'Playfair Display',serif; font-size:1.5rem; color:#fff; }
  .header-left p { color:var(--gold); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; margin-top:2px; }
  .header-right { display:flex; gap:10px; }
  .hbtn { padding:7px 14px; border-radius:4px; font-family:'Inter',sans-serif; font-size:12px; font-weight:600; cursor:pointer; border:none; text-decoration:none; }
  .hbtn-outline { background:transparent; color:#ccc; border:1px solid rgba(255,255,255,0.2); }
  .hbtn-signout { background:transparent; color:#aaa; border:none; }

  .tabs { background:#fff; border-bottom:2px solid #e8e0d0; padding:0 40px; display:flex; gap:0; }
  .tab { padding:14px 20px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; }
  .tab.active { color:var(--ink); border-bottom-color:var(--gold); }

  .main { max-width:900px; margin:0 auto; padding:28px 20px 60px; }

  .stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:28px; }
  .stat-card { background:#fff; border-radius:6px; padding:16px; box-shadow:0 2px 8px rgba(26,26,46,0.08); text-align:center; }
  .stat-num { font-family:'Playfair Display',serif; font-size:2rem; font-weight:900; color:var(--ink); }
  .stat-label { font-size:11px; color:var(--muted); margin-top:4px; }

  .request-card { background:#fff; border-radius:6px; box-shadow:0 2px 10px rgba(26,26,46,0.08); margin-bottom:14px; overflow:hidden; }
  .rc-top { height:4px; }
  .rc-body { padding:16px 18px; }
  .rc-title { font-family:'Playfair Display',serif; font-size:1rem; font-weight:700; margin-bottom:4px; }
  .rc-meta { font-size:11px; color:var(--muted); margin-bottom:12px; display:flex; flex-wrap:wrap; gap:12px; }
  .rc-actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .action-btn { padding:7px 14px; border:none; border-radius:4px; font-family:'Inter',sans-serif; font-size:11px; font-weight:600; cursor:pointer; transition:all 0.15s; }
  .btn-approve { background:var(--green); color:#fff; }
  .btn-ready { background:#1a73e8; color:#fff; }
  .btn-complete { background:#6c3483; color:#fff; }
  .status-pill { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:600; }
  .s-pending { background:#f3e5f5; color:#6a1b9a; }
  .s-arranging { background:#e3f2fd; color:#0d47a1; }
  .s-ready { background:#e8f5e9; color:#1b5e20; }
  .s-received { background:#fff8e1; color:#e65100; }
  .s-returned { background:#f1f8e9; color:#33691e; }
  .s-overdue { background:#ffebee; color:#b71c1c; font-weight:800; }

  .due-date-input { padding:6px 10px; border:1px solid #c4b99e; border-radius:4px; font-family:'Inter',sans-serif; font-size:11px; }

  .empty { text-align:center; padding:48px; color:var(--muted); }
  .section-title { font-size:13px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:12px; margin-top:24px; }
  .overdue-banner { background:#ffebee; border:1px solid #ffcdd2; border-radius:6px; padding:12px 16px; margin-bottom:16px; font-size:13px; color:#b71c1c; font-weight:600; }

  .signin-prompt { text-align:center; padding:80px 20px; }
  .signin-prompt h2 { font-family:'Playfair Display',serif; font-size:1.8rem; margin-bottom:12px; }
  .google-btn { display:inline-flex; align-items:center; gap:10px; padding:12px 24px; background:#fff; border:2px solid #ddd; border-radius:4px; font-family:'Inter',sans-serif; font-size:14px; font-weight:600; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
  .google-btn img { width:20px; height:20px; }
  .access-denied { text-align:center; padding:80px 20px; color:var(--red); }

  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 24px; border-radius:4px; font-size:13px; z-index:9999; display:none; }
  .toast.show { display:block; }

  .loading { text-align:center; padding:60px; color:var(--muted); }

  .cabinet-section { background:#fff; border-radius:6px; box-shadow:0 2px 10px rgba(26,26,46,0.08); margin-bottom:20px; overflow:hidden; }
  .cabinet-section-header { background:var(--ink); padding:14px 18px; display:flex; justify-content:space-between; align-items:center; }
  .cabinet-section-header h3 { color:#fff; font-size:13px; font-weight:600; }
  .cabinet-section-body { padding:16px 18px; display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; }
  .cabinet-input-group { display:flex; flex-direction:column; gap:5px; }
  .cabinet-input-group label { font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; }
  .cabinet-code-input { padding:10px 14px; border:2px solid #e8e0d0; border-radius:4px; font-family:'Inter',sans-serif; font-size:20px; font-weight:700; letter-spacing:0.2em; width:140px; color:var(--ink); text-align:center; }
  .cabinet-code-input:focus { border-color:var(--gold); outline:none; }
  .cabinet-save-btn { padding:10px 20px; background:var(--gold); color:#fff; border:none; border-radius:4px; font-family:'Inter',sans-serif; font-size:13px; font-weight:600; cursor:pointer; }
  .cabinet-save-btn:hover { background:#9a6d0a; }
  .cabinet-current { background:#f7f4ef; border-radius:4px; padding:10px 16px; font-size:13px; color:var(--muted); }
  .cabinet-current strong { color:var(--ink); font-size:18px; letter-spacing:0.15em; }
  .cabinet-changed-note { font-size:11px; color:#2e7d32; margin-top:4px; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Library Admin</h1>
    <p>Sector 40 Neighbourhood Library</p>
  </div>
  <div class="header-right">
    <a href="library.html" class="hbtn hbtn-outline">← Library</a>
    <button class="hbtn hbtn-signout" onclick="signOutUser()">Sign out</button>
  </div>
</header>

<div class="tabs" id="tabs" style="display:none">
  <div class="tab active" onclick="showTab('active',this)">Active Requests</div>
  <div class="tab" onclick="showTab('returned',this)">Returned</div>
  <div class="tab" onclick="showTab('all',this)">All History</div>
</div>

<div id="cabinetWrapper" style="max-width:900px;margin:20px auto 0;padding:0 20px;">
  <div class="cabinet-section" id="cabinetSection"></div>
</div>
<div id="appContent">
  <div class="loading">Loading...</div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, setDoc, getDoc, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAxZfGdjhdR1y2I5qLR7TeZMjRKjqgUyUU",
  authDomain: "sector40library.firebaseapp.com",
  projectId: "sector40library",
  storageBucket: "sector40library.firebasestorage.app",
  messagingSenderId: "752708650749",
  appId: "1:752708650749:web:1484a7203e4032ea46a094"
};

const ADMIN_EMAIL = 'dprasad783@gmail.com';
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let allRequests = [];
let currentTab = 'active';
let currentCabinetCode = null;

// Cabinet code functions
async function loadCabinetCode() {
  try {
    const snap = await getDoc(doc(db, 'settings', 'cabinet'));
    if (snap.exists()) {
      currentCabinetCode = snap.data().code;
      renderCabinetSection(snap.data());
    } else {
      renderCabinetSection(null);
    }
  } catch(e) { console.error('Cabinet load error:', e); }
}

function renderCabinetSection(data) {
  const el = document.getElementById('cabinetSection');
  if (!el) return;
  const currentDisplay = data ? 
    '<div class="cabinet-current">Current code: <strong>' + data.code + '</strong><div class="cabinet-changed-note">Last updated: ' + (data.updatedAt ? new Date(data.updatedAt.toDate()).toLocaleString('en-IN') : 'unknown') + '</div></div>' : 
    '<div class="cabinet-current" style="color:#c0392b">No code set yet</div>';
  el.innerHTML = '<div class="cabinet-section-header"><h3>🔒 Cabinet Combination Code</h3></div>' +
    '<div class="cabinet-section-body">' +
    '<div class="cabinet-input-group"><label>Set New Code</label>' +
    '<input type="text" id="newCabinetCode" class="cabinet-code-input" placeholder="e.g. 4821" maxlength="6"></div>' +
    '<button class="cabinet-save-btn" onclick="saveCabinetCode()">Update Code</button>' +
    currentDisplay +
    '</div>';
}

window.saveCabinetCode = async function() {
  const input = document.getElementById('newCabinetCode');
  const code = input ? input.value.trim() : '';
  if (!code) { showToast('Please enter a code.'); return; }
  if (!/^[0-9A-Za-z]{3,8}$/.test(code)) { showToast('Code must be 3-8 alphanumeric characters.'); return; }
  try {
    await setDoc(doc(db, 'settings', 'cabinet'), {
      code,
      updatedAt: serverTimestamp(),
      updatedBy: ADMIN_EMAIL
    });
    currentCabinetCode = code;
    showToast('Cabinet code updated to ' + code + '. All active dashboards will show the new code immediately.');
    loadCabinetCode();
  } catch(e) { showToast('Error saving code: ' + e.message); }
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

window.signOutUser = async () => { await signOut(auth); window.location.href = 'library.html'; };
window.signInWithGoogle = async () => { try { await signInWithPopup(auth, provider); } catch(e) {} };

window.showTab = function(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderContent(allRequests);
};

function getDaysLeft(dueDateTs) {
  if (!dueDateTs) return null;
  const due = dueDateTs.toDate ? dueDateTs.toDate() : new Date(dueDateTs);
  const now = new Date();
  return Math.ceil((due - now) / (1000*60*60*24));
}

function formatDate(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'});
}

function getStatusPill(status, daysLeft) {
  const map = {
    'Pending Approval':['s-pending','⏳'],
    'Being Arranged':['s-arranging','📦'],
    'Ready for Pickup':['s-ready','✅'],
    'Received':['s-received','📖'],
    'Returned in Pickup Box':['s-returned','🔄'],
    'Completed':['s-returned','✅']
  };
  if (status === 'Received' && daysLeft !== null && daysLeft < 0) {
    return '<span class="status-pill s-overdue">🚨 OVERDUE (' + Math.abs(daysLeft) + ' days)</span>';
  }
  const [cls, emoji] = map[status] || ['s-pending','⏳'];
  return '<span class="status-pill ' + cls + '">' + emoji + ' ' + status + '</span>';
}

window.approveRequest = async function(id) {
  try {
    await updateDoc(doc(db,'requests',id), {
      status: 'Being Arranged',
      approvedAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });
    showToast('Request approved. Due date will be set automatically when resident collects the book.');
  } catch(e) { showToast('Error: ' + e.message); }
};

window.markReady = async function(id) {
  try {
    await updateDoc(doc(db,'requests',id), {
      status: 'Ready for Pickup',
      readyAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });
    showToast('Book marked as Ready for Pickup. Resident will see this on their dashboard.');
  } catch(e) { showToast('Error: ' + e.message); }
};

window.markComplete = async function(id) {
  try {
    await updateDoc(doc(db,'requests',id), {
      status: 'Completed',
      completedAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });
    showToast('Request completed. Book is back as Available.');
  } catch(e) { showToast('Error: ' + e.message); }
};

function getDefaultDueDate() {
  const d = new Date();
  d.setDate(d.getDate() + 14);
  return d.toISOString().split('T')[0];
}

function renderContent(requests) {
  const content = document.getElementById('appContent');
  let filtered;
  const activeStatuses = ['Pending Approval','Being Arranged','Ready for Pickup','Received'];
  const returnedStatuses = ['Returned in Pickup Box'];

  if (currentTab === 'active') filtered = requests.filter(r => activeStatuses.includes(r.status));
  else if (currentTab === 'returned') filtered = requests.filter(r => returnedStatuses.includes(r.status));
  else filtered = requests;

  const pending = requests.filter(r => r.status === 'Pending Approval').length;
  const active = requests.filter(r => ['Being Arranged','Ready for Pickup','Received'].includes(r.status)).length;
  const overdue = requests.filter(r => r.status === 'Received' && getDaysLeft(r.dueDate) < 0).length;
  const returned = requests.filter(r => r.status === 'Returned in Pickup Box').length;

  let html = '<div class="main">';
  html += `<div class="stats-row">
    <div class="stat-card"><div class="stat-num">${pending}</div><div class="stat-label">Pending Approval</div></div>
    <div class="stat-card"><div class="stat-num">${active}</div><div class="stat-label">Active Borrows</div></div>
    <div class="stat-card"><div class="stat-num" style="color:${overdue>0?'#b71c1c':'inherit'}">${overdue}</div><div class="stat-label">Overdue</div></div>
    <div class="stat-card"><div class="stat-num">${returned}</div><div class="stat-label">Awaiting Verification</div></div>
  </div>`;

  if (overdue > 0) {
    html += '<div class="overdue-banner">🚨 ' + overdue + ' book' + (overdue>1?'s are':' is') + ' overdue. Please follow up with the borrower(s).</div>';
  }

  if (filtered.length === 0) {
    html += '<div class="empty">No requests in this category.</div>';
  } else {
    filtered.forEach(r => {
      const daysLeft = getDaysLeft(r.dueDate);
      let actionHtml = '';
      if (r.status === 'Pending Approval') {
        actionHtml = `<button class="action-btn btn-approve" onclick="approveRequest('${r.id}')">✓ Approve Request</button>`;
      } else if (r.status === 'Being Arranged') {
        actionHtml = `<button class="action-btn btn-ready" onclick="markReady('${r.id}')">📦 Mark Ready for Pickup</button>`;
      } else if (r.status === 'Returned in Pickup Box') {
        actionHtml = `<button class="action-btn btn-complete" onclick="markComplete('${r.id}')">✓ Verify Return & Mark Complete</button>`;
      }

      html += `<div class="request-card">
        <div class="rc-top" style="background:${r.status==='Pending Approval'?'#6a1b9a':r.status==='Returned in Pickup Box'?'#33691e':'#1a7c3e'}"></div>
        <div class="rc-body">
          <div class="rc-title">${r.bookTitle}</div>
          <div class="rc-meta">
            <span>👤 ${r.userName || 'Unknown'}</span>
            <span>📧 ${r.userEmail}</span>
            <span>📅 Requested: ${formatDate(r.requestedAt)}</span>
            ${r.dueDate ? '<span>⏰ Due: ' + formatDate(r.dueDate) + '</span>' : '<span style="color:var(--muted);font-style:italic">Due date set on collection</span>'}
          </div>
          <div class="rc-actions">
            ${getStatusPill(r.status, daysLeft)}
            ${daysLeft !== null && r.status==='Received' ? '<span style="font-size:11px;font-weight:600;color:' + (daysLeft<0?'#b71c1c':daysLeft<=3?'#e65100':'#2e7d32') + '">' + (daysLeft<0?'🚨 '+Math.abs(daysLeft)+' days overdue':daysLeft+' days remaining') + '</span>' : ''}
            ${actionHtml}
          </div>
        </div>
      </div>`;
    });
  }

  html += '</div>';
  content.innerHTML = html;
}

onAuthStateChanged(auth, user => {
  const content = document.getElementById('appContent');
  const tabs = document.getElementById('tabs');

  if (!user) {
    tabs.style.display = 'none';
    document.getElementById('cabinetWrapper').style.display = 'none';
    content.innerHTML = `<div class="signin-prompt">
      <h2>Admin Sign In</h2>
      <p>This page is restricted to the library administrator.</p>
      <button class="google-btn" onclick="signInWithGoogle()"><img src="https://www.google.com/favicon.ico" alt="G"> Sign in with Google</button>
    </div>`;
    return;
  }

  if (user.email !== ADMIN_EMAIL) {
    tabs.style.display = 'none';
    document.getElementById('cabinetWrapper').style.display = 'none';
    content.innerHTML = `<div class="access-denied">
      <h2 style="font-family:'Playfair Display',serif;margin-bottom:12px">Access Denied</h2>
      <p>This page is only accessible to the library administrator.</p>
      <a href="library.html" style="display:inline-block;margin-top:20px;padding:10px 20px;background:var(--ink);color:#fff;border-radius:4px;text-decoration:none;font-size:13px">← Back to Library</a>
    </div>`;
    return;
  }

  tabs.style.display = 'flex';
  document.getElementById('cabinetWrapper').style.display = 'block';

  loadCabinetCode();

  const q = query(collection(db,'requests'), orderBy('requestedAt','desc'));
  onSnapshot(q, snap => {
    allRequests = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    renderContent(allRequests);
  });
});
</script>
</body>
</html>
